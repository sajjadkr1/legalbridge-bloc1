<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | LegalBridge</title>
    <meta name="description" content="LegalBridge : trouver un avocat selon sa spécialité et sa ville.">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/ajustements.css">
    <script defer src="js/donnees.js"></script>
    <script defer src="js/commun.js"></script>
    <script defer src="js/contact.js"></script>
</head>

<body><a class="skip-link" href="#contenu">Aller au contenu</a>
    <nav class="navbar" aria-label="Navigation principale"><a class="logo" href="index.html"
            aria-label="Retour à l'accueil"><img src="img/logo.png" alt="LegalBridge" width="60" height="60"></a>
        <ul>
            <li><a href="login.html" id="login-link">Connexion</a></li>
            <li hidden id="appointments-item"><button type="button" id="appointments-toggle" aria-expanded="false"
                    aria-controls="appointments-popup">Mes rendez-vous</button></li>
            <li hidden id="logout-item"><button type="button" id="logout">Se déconnecter</button></li>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="avocats.html">Trouvez un avocat</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="about.html">À propos</a></li>
        </ul>
        <section class="rendez-vous-popup" id="appointments-popup" aria-label="Mes rendez-vous de démonstration" hidden>
            <h2>Mes rendez-vous</h2><button class="close-popup" type="button" id="appointments-close">Fermer</button>
            <div id="appointments-list"></div>
        </section>
    </nav>
    <main id="contenu">
        <section class="contact-container">

            <div class="contact-header">
                <h1>Contactez-nous</h1>

                <p>
                    Une question concernant LegalBridge ?
                    Envoyez-nous un message.
                </p>
            </div>


            <div class="contact-card">

                <p class="demo-note"></p>
                <form id="contact-form">

                    <div class="form-group">
                        <label for="nom">Nom</label>

                        <input id="nom" name="nom" required type="text" placeholder="Votre nom" autocomplete="name">
                    </div>


                    <div class="form-group">
                        <label for="email">Adresse email</label>

                        <input id="email" name="email" required type="email" placeholder="Votre adresse email"
                            autocomplete="email">
                    </div>


                    <div class="form-group">
                        <label for="sujet">Sujet</label>

                        <input id="sujet" name="sujet" required type="text" placeholder="Sujet de votre message">
                    </div>


                    <div class="form-group">
                        <label for="message">Message</label>

                        <textarea id="message" name="message" required rows="6"
                            placeholder="Écrivez votre message..."></textarea>
                    </div>


                    <button type="submit">
                        Envoyer le message
                    </button>

                </form>
                <p id="contact-status" class="success-message" role="status" hidden></p>

            </div>

        </section>
        
    </main>
    <footer class="footer">

        <p class="footer-copyright">
            &copy; 2026 LegalBridge. Tous droits réservés.
        </p>


        <div class="footer-links">

            <p class="footer-title">
                Liens utiles
            </p>

            <ul>

                <li>
                    <a href="contact.html">
                        Contactez-nous
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        À propos
                    </a>
                </li>

            </ul>

        </div>

    </footer>
</body>

</html>
