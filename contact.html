<!doctype html>

<html lang="fr">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Contact | LegalBridge
    </title>

    <meta
        name="description"
        content="LegalBridge : trouver un avocat selon sa spécialité et sa ville."
    >

    <link
        rel="icon"
        href="favicon.ico"
    >

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/footer.css"
    >

    <link
        rel="stylesheet"
        href="css/contact.css"
    >

    <link
        rel="stylesheet"
        href="css/ajustements.css"
    >

</head>


<body>


    <a
        class="skip-link"
        href="#contenu"
    >
        Aller au contenu
    </a>


    <!-- ========================= -->
    <!-- NAVIGATION -->
    <!-- ========================= -->

    <nav
        class="navbar"
        aria-label="Navigation principale"
    >

        <a
            class="logo"
            href="index.html"
            aria-label="Retour à l'accueil"
        >

            <img
                src="img/logo.png"
                alt="LegalBridge"
                width="60"
                height="60"
            >

        </a>


        <ul>

            <li>
                <a
                    href="login.html"
                    id="login-link"
                >
                    Connexion
                </a>
            </li>


            <li
                id="appointments-item"
                hidden
            >

                <button
                    type="button"
                    id="appointments-toggle"
                    aria-expanded="false"
                    aria-controls="appointments-popup"
                >
                    Mes rendez-vous
                </button>

            </li>


            <li
                id="logout-item"
                hidden
            >

                <button
                    type="button"
                    id="logout"
                >
                    Se déconnecter
                </button>

            </li>


            <li>
                <a href="index.html">
                    Accueil
                </a>
            </li>


            <li>
                <a href="avocats.html">
                    Trouvez un avocat
                </a>
            </li>


            <li>
                <a
                    href="contact.html"
                    aria-current="page"
                >
                    Contact
                </a>
            </li>


            <li>
                <a href="about.html">
                    À propos
                </a>
            </li>

        </ul>


        <!-- ========================= -->
        <!-- RENDEZ-VOUS -->
        <!-- ========================= -->

        <section
            class="rendez-vous-popup"
            id="appointments-popup"
            aria-label="Mes rendez-vous"
            hidden
        >

            <h2>
                Mes rendez-vous
            </h2>


            <button
                class="close-popup"
                type="button"
                id="appointments-close"
            >
                Fermer
            </button>


            <div id="appointments-list"></div>

        </section>

    </nav>


    <!-- ========================= -->
    <!-- CONTENU PRINCIPAL -->
    <!-- ========================= -->

    <main
        id="contenu"
        tabindex="-1"
    >

        <section class="contact-container">


            <div class="contact-header">

                <h1>
                    Contactez-nous
                </h1>


                <p>
                    Une question concernant LegalBridge ?
                    Envoyez-nous un message.
                </p>

            </div>


            <div class="contact-card">


                <form id="contact-form">


                    <div class="form-group">

                        <label for="nom">
                            Nom
                        </label>


                        <input
                            id="nom"
                            name="nom"
                            type="text"
                            placeholder="Votre nom"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Adresse email
                        </label>


                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="Votre adresse email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="sujet">
                            Sujet
                        </label>


                        <input
                            id="sujet"
                            name="sujet"
                            type="text"
                            placeholder="Sujet de votre message"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>


                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Écrivez votre message..."
                            required
                        ></textarea>

                    </div>


                    <button type="submit">
                        Envoyer le message
                    </button>

                </form>


                <p
                    id="contact-status"
                    class="success-message"
                    role="status"
                    hidden
                ></p>

            </div>

        </section>

    </main>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="footer">

        <p class="footer-copyright">
            &copy; 2026 LegalBridge.
            Tous droits réservés.
        </p>


        <div class="footer-links">

            <p class="footer-title">
                Liens utiles
            </p>


            <ul>

                <li>
                    <a href="contact.html">
                        Contactez-nous
                    </a>
                </li>


                <li>
                    <a href="about.html">
                        À propos
                    </a>
                </li>

            </ul>

        </div>

    </footer>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="js/donnees.js"></script>
    <script src="js/commun.js"></script>
    <script src="js/contact.js"></script>


</body>

</html>
