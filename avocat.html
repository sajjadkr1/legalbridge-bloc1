<!doctype html>

<html lang="fr">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Profil avocat | LegalBridge
    </title>

    <meta
        name="description"
        content="Consultez le profil d'un avocat sur LegalBridge."
    >

    <link
        rel="icon"
        href="favicon.png"
    >

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/footer.css"
    >

    <link
        rel="stylesheet"
        href="css/detail.css"
    >

    <link
        rel="stylesheet"
        href="css/ajustements.css"
    >

</head>


<body>


    <a
        class="skip-link"
        href="#contenu"
    >
        Aller au contenu
    </a>


    <!-- ========================= -->
    <!-- NAVIGATION -->
    <!-- ========================= -->

    <nav
        class="navbar"
        aria-label="Navigation principale"
    >

        <a
            class="logo"
            href="index.html"
            aria-label="Retour à l'accueil"
        >

            <img
                src="img/logo.png"
                alt="LegalBridge"
                width="60"
                height="60"
            >

        </a>


        <ul>

            <li>
                <a
                    href="login.html"
                    id="login-link"
                >
                    Connexion
                </a>
            </li>


            <li
                hidden
                id="appointments-item"
            >
                <button
                    type="button"
                    id="appointments-toggle"
                    aria-expanded="false"
                    aria-controls="appointments-popup"
                >
                    Mes rendez-vous
                </button>
            </li>


            <li
                hidden
                id="logout-item"
            >
                <button
                    type="button"
                    id="logout"
                >
                    Se déconnecter
                </button>
            </li>


            <li>
                <a href="index.html">
                    Accueil
                </a>
            </li>


            <li>
                <a href="avocats.html">
                    Trouvez un avocat
                </a>
            </li>


            <li>
                <a href="contact.html">
                    Contact
                </a>
            </li>


            <li>
                <a href="about.html">
                    À propos
                </a>
            </li>

        </ul>


        <!-- ========================= -->
        <!-- RENDEZ-VOUS -->
        <!-- ========================= -->

        <section
            class="rendez-vous-popup"
            id="appointments-popup"
            aria-label="Mes rendez-vous"
            hidden
        >

            <h2>
                Mes rendez-vous
            </h2>


            <button
                class="close-popup"
                type="button"
                id="appointments-close"
            >
                Fermer
            </button>


            <div id="appointments-list"></div>

        </section>

    </nav>


    <!-- ========================= -->
    <!-- CONTENU -->
    <!-- ========================= -->

    <main
        id="contenu"
        tabindex="-1"
    >

        <section
            id="detail"
            aria-live="polite"
        >

            <p class="loading-message">
                Chargement du profil...
            </p>

        </section>

    </main>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="footer">

        <p class="footer-copyright">
            &copy; 2026 LegalBridge.
            Tous droits réservés.
        </p>


        <div class="footer-links">

            <p class="footer-title">
                Liens utiles
            </p>


            <ul>

                <li>
                    <a href="contact.html">
                        Contactez-nous
                    </a>
                </li>


                <li>
                    <a href="about.html">
                        À propos
                    </a>
                </li>

            </ul>

        </div>

    </footer>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="js/donnees.js"></script>
    <script src="js/commun.js"></script>
    <script src="js/detail.js"></script>


</body>

</html>
